<svg width="838" height="214" viewBox="0 0 838 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two case folders: MAC_CHANGER and Network_scanner" style="display:block"><rect x="0" y="0" width="838" height="214" fill="#0d0d0d"></rect><rect x="0" y="6" width="84" height="20" fill="#cfc9b4"></rect><text x="10" y="20" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="2">FILE 01</text><rect x="0" y="24" width="411" height="190" fill="#e9e5d6"></rect><text x="18" y="64" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">MAC_CHANGER</text><line x1="18" y1="78" x2="393" y2="78" stroke="#cfc9b4" stroke-width="1.5"></line><text x="18" y="104" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Change the identity of a network interface.</text><text x="18" y="123" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Written in Python.</text><rect x="18" y="158" width="66" height="22" fill="none" stroke="#14110f" stroke-width="1.2"></rect><text x="51" y="173" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PYTHON</text><rect x="92" y="158" width="74" height="22" fill="none" stroke="#14110f" stroke-width="1.2"></rect><text x="129" y="173" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">LAYER 2</text><g transform="translate(306 156) rotate(-3)"><rect x="0" y="0" width="87" height="28" fill="none" stroke="#c8102e" stroke-width="2"></rect><text x="43.5" y="19" fill="#c8102e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="2">SHIPPED</text></g><rect x="427" y="6" width="84" height="20" fill="#cfc9b4"></rect><text x="437" y="20" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="2">FILE 02</text><rect x="427" y="24" width="411" height="190" fill="#e9e5d6"></rect><text x="445" y="64" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">Network_scanner</text><line x1="445" y1="78" x2="820" y2="78" stroke="#cfc9b4" stroke-width="1.5"></line><text x="445" y="104" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Rebuild an Nmap-style scanner from scratch to</text><text x="445" y="123" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">see how such tools work under the hood.</text><rect x="445" y="158" width="66" height="22" fill="none" stroke="#14110f" stroke-width="1.2"></rect><text x="478" y="173" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PYTHON</text><rect x="519" y="158" width="58" height="22" fill="none" stroke="#14110f" stroke-width="1.2"></rect><text x="548" y="173" fill="#14110f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">RECON</text><g transform="translate(742 156) rotate(-3)"><rect x="0" y="0" width="78" height="28" fill="none" stroke="#c8102e" stroke-width="2"></rect><text x="39" y="19" fill="#c8102e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="2">ACTIVE</text></g></svg>
